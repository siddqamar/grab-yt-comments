[project]
name = "grab-yt-comments"
version = "0.1.0"
description = "Scrape YouTube comments with the official API and optionally classify them with a local LLM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "gradio>=4.0.0",
    "python-dotenv",
    "requests>=2.31.0",
    "uvicorn>=0.29.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]


[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.0",
]
